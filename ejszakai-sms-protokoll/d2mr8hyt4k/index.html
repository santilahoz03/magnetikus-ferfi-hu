<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Éjszakai SMS Protokoll™ — Letöltés</title>
<style>
  :root{--bg:#FBF9F5;--ink:#17130E;--acc:#A63A2A;--muted:#6B5E54;--line:#E2D9CE}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:40px 36px;max-width:480px;width:100%;text-align:center}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:12px}
  h1{font-size:26px;font-weight:700;line-height:1.2;margin-bottom:8px}
  .sub{font-size:15px;color:var(--muted);margin-bottom:32px;line-height:1.5}
  .btn{display:inline-block;background:var(--acc);color:#fff;font-size:15px;font-weight:700;padding:16px 32px;border-radius:10px;text-decoration:none;margin-bottom:14px;width:100%}
  .note{font-size:12px;color:var(--muted)}
  .icon{font-size:48px;margin-bottom:16px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔒</div>
  <div class="lbl">OTO 3 · Titkos Bónusz</div>
  <h1>Éjszakai SMS Protokoll™</h1>
  <p class="sub">Mikor küldhetsz, mit küldj és hogyan válaszolj, ha ő ír éjszaka. Az éjszakai üzenetek saját szabályai.</p>
  <a class="btn" href="ejszakai-sms-protokoll.pdf" download="Ejszakai-SMS-Protokoll.pdf">Letöltés (PDF)</a>
  <p class="note">PDF fájl · Nyisd meg bármilyen olvasóban</p>
</div>
</body>
</html>
